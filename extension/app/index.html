<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ok-online judge</title><link rel="stylesheet" href="bundle.css"><link rel="stylesheet" href="app.css"></head>
<body>
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">ok<span>.</span></span><b>online judge</b></a><span id="hostLabel" class="host">EX-OJ</span><div class="top-spacer"></div><button id="theme" class="quiet" title="편집기 테마 변경" aria-label="편집기 테마 변경">◐</button><button id="refresh" class="quiet" title="목록 새로고침" aria-label="목록 새로고침">↻</button><button id="close" class="quiet" title="학교 화면으로" aria-label="학교 화면으로">↗</button></header>
<nav class="coursebar"><label for="course">강좌</label><select id="course" aria-label="강좌 선택"><option>불러오는 중…</option></select><span class="slash">/</span><label for="contest">탭</label><select id="contest" aria-label="탭 선택"><option>탭 선택</option></select><a id="original" class="original" target="_blank" rel="noopener">원문 ↗</a></nav>
<div id="notice" class="notice" role="status" hidden></div>
<div class="problembar"><button id="previous" class="quiet" aria-label="이전 문제">‹</button><div id="problems" class="problem-tabs" role="tablist" aria-label="문제 목록"></div><button id="next" class="quiet" aria-label="다음 문제">›</button></div>
<main id="workspace" class="workspace">
<section id="leftPane" class="left-pane"><div class="pane-head"><div class="left-tabs"><button id="statementTab" class="selected">문제</button><button id="bookTab">교재</button></div><span id="limits" class="limits"></span><button id="uploadBook" class="quiet" title="교재 PDF 불러오기" aria-label="교재 PDF 불러오기">＋</button><button id="fold" class="quiet" title="문제 접기" aria-label="문제 접기">‹</button></div>
<div id="statement" class="statement"><div class="empty">문제를 선택하세요.</div></div>
<div id="bookPane" class="book-pane" hidden><div class="book-tools"><span id="bookName">교재 PDF</span><button id="bookPrevious" aria-label="교재 이전 페이지">‹</button><label>페이지 <input id="bookPage" type="number" min="1" value="1" aria-label="교재 페이지"><span id="bookTotal"></span></label><button id="bookNext" aria-label="교재 다음 페이지">›</button><select id="bookZoom" aria-label="교재 확대"><option value="fit">너비 맞춤</option><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select><button id="removeBook" title="교재 제거" aria-label="교재 제거">×</button></div><div id="pdfHost" class="pdf-host"><button id="pickBook" class="empty-book">PDF 불러오기</button></div></div>
<input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
</section>
<div id="splitter" class="splitter" role="separator" tabindex="0" aria-label="문제와 코드 비율 조절" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="75" aria-valuenow="43"><button id="unfold" title="문제 펼치기" aria-label="문제 펼치기" hidden>›</button></div>
<section class="right-pane"><div class="editor-head"><span id="fileName" class="file-name">main.c</span><span id="saved" class="saved">자동 저장</span><div class="top-spacer"></div><button id="restore" class="editor-button" title="최근 제출 코드 불러오기">최근 코드</button><select id="language" aria-label="언어 선택"></select><select id="fontSize" aria-label="편집기 글자 크기"><option value="13">13px</option><option value="14" selected>14px</option><option value="16">16px</option><option value="18">18px</option><option value="20">20px</option></select></div>
<div id="editor" class="editor"></div>
<div id="outputSplitter" class="output-splitter" role="separator" tabindex="0" aria-label="결과 창 높이 조절" aria-orientation="horizontal"></div>
<div id="console" class="console"><div class="console-head"><button id="runTab" class="selected">실행</button><button id="resultTab">채점 결과</button><button id="historyTab">제출 기록</button><span id="runInfo" class="run-info"></span><div class="top-spacer"></div><button id="toggleConsole" class="quiet" aria-label="결과 창 접기">⌄</button></div><div id="runPane" class="run-pane"><div class="input-box"><label for="stdin">입력 <span>stdin</span></label><textarea id="stdin" spellcheck="false" placeholder="직접 테스트할 입력을 넣으세요."></textarea></div><div class="output-box"><div class="output-title">출력 <span>stdout / stderr</span><button id="clearOutput" class="quiet" aria-label="출력 지우기">×</button></div><pre id="stdout">Run을 눌러 실행하세요.</pre></div></div><div id="resultPane" class="result-pane" hidden><div class="empty">아직 제출한 결과가 없습니다.</div></div><div id="historyPane" class="history-pane" hidden></div></div>
<footer class="actionbar"><span id="problemLabel" class="current-problem">문제 선택</span><div class="top-spacer"></div><button id="run" class="run-button">▷ Run</button><button id="sample" class="sample-button">Sample Submit</button><button id="submit" class="submit-button">Submit ↗</button></footer></section>
</main><script type="module" src="bundle.js"></script>
</body></html>
